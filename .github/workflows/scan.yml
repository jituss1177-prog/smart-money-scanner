name: Daily Smart Money Scanner

on:
  schedule:
    # Yeh roz subah 8:30 AM IST (3:00 AM UTC) par chalega
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # Isse aap manually 'Run workflow' button daba kar bhi chala sakte hain

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scanner Script
        run: python scanner.py
